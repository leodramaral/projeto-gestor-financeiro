{% load icon_tags %}{% load static %}
<header
  x-data="{menuToggle: false}"
  class="sticky top-0 z-99999 flex w-full border-gray-200 bg-white xl:border-b dark:border-gray-800 dark:bg-gray-900"
>
  <div
    class="flex grow flex-col items-center justify-between xl:flex-row xl:px-6"
  >
    <div
      class="flex w-full items-center justify-between gap-2 border-b border-gray-200 px-3 py-3 sm:gap-4 lg:py-4 xl:justify-normal xl:border-b-0 xl:px-0 dark:border-gray-800"
    >
      <!-- Hamburger Toggle BTN -->
      <button
        :class="sidebarToggle ? 'xl:bg-transparent dark:xl:bg-transparent bg-gray-100 dark:bg-gray-800' : ''"
        class="z-99999 flex h-10 w-10 items-center justify-center rounded-lg border-gray-200 text-gray-500 xl:h-11 xl:w-11 xl:border dark:border-gray-800 dark:text-gray-400"
        @click.stop="sidebarToggle = !sidebarToggle"
      >
        <span class="hidden xl:block">{% lucide "menu" "h-5 w-5" %}</span>

        <span :class="sidebarToggle ? 'hidden' : 'block xl:hidden'" class="xl:hidden">{% lucide "menu" "h-6 w-6" %}</span>

        <!-- cross icon -->
        <span :class="sidebarToggle ? 'block xl:hidden' : 'hidden'">{% lucide "x" "h-6 w-6" %}</span>
      </button>
      <!-- Hamburger Toggle BTN -->

      <a href="{% url 'home' %}" class="xl:hidden" aria-label="Gestor Financeiro">
        {% include "partials/brand.html" with text=True %}
      </a>

      <!-- Application nav menu button -->
      <button
        class="z-99999 flex h-10 w-10 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-100 xl:hidden dark:text-gray-400 dark:hover:bg-gray-800"
        :class="menuToggle ? 'bg-gray-100 dark:bg-gray-800' : ''"
        @click.stop="menuToggle = !menuToggle"
      >
        {% lucide "ellipsis" "h-6 w-6" %}
      </button>
      <!-- Application nav menu button -->
    </div>

    <div
      :class="menuToggle ? 'flex' : 'hidden'"
      class="shadow-theme-md w-full items-center justify-between gap-4 px-5 py-4 xl:flex xl:justify-end xl:px-0 xl:shadow-none"
    >
      <div class="2xsm:gap-3 flex items-center gap-2">
        {% include "partials/theme_toggle.html" %}
        {% if user.is_authenticated %}
          <div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
            <button
              type="button"
              class="flex items-center gap-3 rounded-full py-1 pr-2 pl-1 text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800"
              aria-haspopup="menu"
              :aria-expanded="open"
              aria-label="Menu do usuário"
              @click="open = !open"
            >
              {% include "partials/user_avatar.html" with user=user size="h-11 w-11" text="text-sm" %}
              <span class="hidden max-w-40 truncate text-sm font-medium sm:block">{{ user.name }}</span>
              <span class="inline-flex transition-transform motion-reduce:transition-none" :class="open ? 'rotate-180' : ''">{% lucide "chevron-down" "h-[18px] w-[18px]" %}</span>
            </button>
            <div
              x-show="open"
              x-cloak
              x-transition.opacity
              role="menu"
              class="shadow-theme-lg absolute left-0 z-20 mt-2 w-64 xl:right-0 xl:left-auto max-w-[calc(100vw-2rem)] rounded-2xl border border-gray-200 bg-white p-3 dark:border-gray-800 dark:bg-gray-900"
            >
              <div class="border-b border-gray-200 px-3 pt-1 pb-3 dark:border-gray-800">
                <p class="truncate text-sm font-medium text-gray-700 dark:text-gray-400">{{ user.name }}</p>
                <p class="truncate text-xs text-gray-500 dark:text-gray-400">{{ user.email }}</p>
              </div>
              <a href="{% url 'accounts:profile' %}" role="menuitem" class="mt-2 flex items-center rounded-lg px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">Ver perfil</a>
              <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" role="menuitem" class="flex w-full items-center rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">Sair</button>
              </form>
            </div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</header>
