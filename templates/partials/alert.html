{% load icon_tags %}{# Alerta de sucesso do TailAdmin. Parâmetros: title, message. #}
<div class="border-success-500 bg-success-50 dark:border-success-500/30 dark:bg-success-500/15 rounded-xl border p-4" role="status">
  <div class="flex items-start gap-3">
    <div class="text-success-600 -mt-0.5">
      {% lucide "circle-check" "h-6 w-6" %}
    </div>
    <div>
      <h4 class="mb-1 text-sm font-semibold text-gray-800 dark:text-white/90">{{ title }}</h4>
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>
    </div>
  </div>
</div>
