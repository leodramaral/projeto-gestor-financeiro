{% load icon_tags %}{# Botão de alternar tema claro/escuro. Exige `darkMode` no x-data do <body> e `setTheme` de partials/theme_init.html. #}
<button
  type="button"
  aria-label="Alternar tema"
  :aria-pressed="darkMode.toString()"
  class="hover:text-dark-900 relative flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
  @click.prevent="darkMode = !darkMode; setTheme(darkMode)"
>
  {% lucide "sun" "hidden h-5 w-5 dark:block" %}
  {% lucide "moon" "h-5 w-5 dark:hidden" %}
</button>
