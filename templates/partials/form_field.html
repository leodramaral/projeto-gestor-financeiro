{# Campo de formulário com rótulo e erros. Parâmetro: field. #}
{% if field.field.widget.input_type == "checkbox" %}
  <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-400">
    {{ field }} {{ field.label }}
  </label>
{% else %}
  <div>
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
      <p class="text-error-500 mt-1.5 text-xs">{{ error }}</p>
    {% endfor %}
    {% if field.help_text %}
      <div class="mt-1.5 text-xs text-gray-500 dark:text-gray-400">{{ field.help_text|safe }}</div>
    {% endif %}
  </div>
{% endif %}
