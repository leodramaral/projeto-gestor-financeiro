<div class="rounded-2xl border border-gray-200 bg-white p-5 min-w-0 dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Fluxo de caixa</h3>
      <p class="text-theme-sm text-gray-500 dark:text-gray-400">Entradas e despesas de cada dia de {{ month.label }}</p>
    </div>
    {% if more_url %}<a href="{{ more_url }}" class="text-brand-500 dark:text-brand-400 shrink-0 text-sm hover:underline">Ver detalhes</a>{% endif %}
  </div>
  <div class="relative mt-5 h-64"><canvas id="chart-cashflow" role="img" aria-label="Gráfico de colunas com as entradas e as despesas de cada dia do mês"></canvas></div>
</div>
