{# Botão "i" que abre a explicação do cartão. Parâmetros: label (nome do cartão), tip (id da explicação). #}
<button type="button" class="flex h-5 w-5 shrink-0 cursor-help items-center justify-center rounded-full border border-gray-300 text-xs leading-none text-gray-500 hover:border-brand-600 hover:text-brand-600 dark:hover:text-brand-400 dark:border-gray-600 dark:text-gray-400" aria-label="Como é calculado: {{ label }}" aria-describedby="{{ tip }}" @click="tip = true" @mouseenter="tip = true" @mouseleave="tip = false" @focus="tip = true" @blur="tip = false" @keydown.escape="tip = false" data-info="{{ tip }}">i</button>
