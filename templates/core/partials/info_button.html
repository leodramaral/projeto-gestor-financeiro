{# Botão "i" que abre a explicação do cartão. Parâmetros: label (nome do indicador), tip (id da explicação) e, opcional, tone="light" para fundo escuro. #}
<button type="button" class="flex h-5 w-5 shrink-0 cursor-help items-center justify-center rounded-full border text-xs leading-none {% if tone == 'light' %}border-white/60 text-white hover:border-white hover:bg-white/10{% else %}border-gray-300 text-gray-500 hover:border-brand-600 hover:text-brand-600 dark:hover:text-brand-400 dark:border-gray-600 dark:text-gray-400{% endif %}" aria-label="Como é calculado: {{ label }}" aria-describedby="{{ tip }}" @click="tip = true" @mouseenter="tip = true" @mouseleave="tip = false" @focus="tip = true" @blur="tip = false" @keydown.escape="tip = false" data-info="{{ tip }}">i</button>
