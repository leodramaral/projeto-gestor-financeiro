<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestor Financeiro{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f2f4f7;font-family:Arial,Helvetica,sans-serif;color:#1d2939;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:20px 32px;background-color:#0f766e;border-radius:8px 8px 0 0;color:#ffffff;font-size:20px;font-weight:bold;">
                Gestor Financeiro
              </td>
            </tr>
            <tr>
              <td style="padding:32px;font-size:16px;line-height:24px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;border-top:1px solid #e4e7ec;font-size:12px;line-height:18px;color:#667085;">
                Você recebeu esta mensagem porque ela foi solicitada para o seu endereço de e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
