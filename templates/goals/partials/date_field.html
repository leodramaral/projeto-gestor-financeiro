{% load icon_tags %}{# Campo de data com ícone de calendário (flatpickr, ver static/js/datepicker.js). Parâmetro: field. #}
<div>
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">{{ field.label }}</label>
  <div class="relative">
    {{ field }}
    <span class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-gray-500 dark:text-gray-400" aria-hidden="true">
      {% lucide "calendar" "h-5 w-5" %}
    </span>
  </div>
  {% for error in field.errors %}
    <p class="text-error-600 dark:text-error-500 mt-1.5 text-xs">{{ error }}</p>
  {% endfor %}
  {% if field.help_text %}
    <div class="mt-1.5 text-xs text-gray-500 dark:text-gray-400">{{ field.help_text|safe }}</div>
  {% endif %}
</div>
