{% extends "base_auth.html" %}
{% block title %}Verifique seu e-mail · Gestor Financeiro{% endblock %}
{% block content %}
  <h1 class="mb-2 text-title-sm font-semibold text-gray-800 dark:text-white/90">Verifique seu e-mail</h1>
  <p class="mb-4 text-sm text-gray-500 dark:text-gray-400">Enviamos um link de confirmação para o e-mail informado. Abra-o para ativar a conta; depois é só entrar.</p>
  <p class="text-sm text-gray-500 dark:text-gray-400">
    Não recebeu? <a href="{% url 'accounts:resend' %}" class="text-brand-500 hover:underline dark:text-brand-400">Reenviar o link</a>
  </p>
{% endblock %}
