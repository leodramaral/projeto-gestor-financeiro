# Atualizações de versão do Dependabot. Os alertas e as atualizações de segurança são ajuste do
# repositório (Settings → Advanced Security), não deste arquivo.
#
# Semanal, na segunda-feira: um PR por ecossistema com as atualizações de minor e patch agrupadas;
# major chega em PR próprio, para ser revisada. O título segue o padrão do projeto (`chore(deps)`).
#
# As faixas do `pyproject.toml` NÃO seguram o Dependabot: ele reescreveu `django>=5.2,<5.3` para a
# 6.1 no primeiro PR. A linha LTS adotada é fixada pelos `ignore` abaixo (Django 5.2, Node 22).
# Para adotar outra versão, remova a entrada de `ignore` e faça a migração numa change própria.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # Fica na linha LTS (5.2): só patches da 5.2 chegam.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # `docker/Dockerfile`: imagem base do Python e a do uv.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # `docker-compose.yml`: node, postgres e mailpit.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # A imagem `node:22-alpine` já acompanha os patches da 22; a próxima major é decisão humana.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
