name: projeto-gestor-financeiro

# Ambiente local: `runserver` com o código montado em /app, então editar um arquivo recarrega a
# aplicação. Não há servidor de produção ainda — a hospedagem não está decidida.

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

services:
  # Compila o CSS (Tailwind) e copia o Alpine.js para static/dist/, e termina. O `web` só sobe depois.
  # Para recompilar ao editar estilos: docker compose run --rm css npm run watch
  css:
    image: node:22-alpine
    # Começa como root só para dar a posse do volume nomeado (criado como root) ao usuário `node`;
    # o npm e o build rodam como `node`, para que static/dist/ não fique com dono root no host.
    user: root
    working_dir: /app
    command: ["sh", "-c", "chown node:node node_modules && su node -s /bin/sh -c 'npm ci && npm run build'"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  web:
    build: *app-build
    image: projeto-gestor-financeiro:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      css:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  node_modules:
