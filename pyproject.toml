[project]
name = "gestor-financeiro"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
# A opção de linha de comando vence o DJANGO_SETTINGS_MODULE do .env (dev).
addopts = "--ds=config.settings.test"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C90", "S"]

[tool.ruff.lint.per-file-ignores]
# Testes usam `assert` por natureza (S101), senhas de fixture (S105/S106/S107) e leem XML do próprio
# repositório (S314): nada disso é risco de produção. Código fora de testes não tem isenção.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S314"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["config", "core", "accounts", "transactions"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
precision = 2
# Piso = cobertura medida (96,719...%), truncada para baixo, nunca arredondada para cima. Só sobe
# quando a cobertura real sobe.
fail_under = 97.84
