[project]
name = "gestor-financeiro"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.18,<5.3",
    "django-environ>=0.14.0",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
# A opção de linha de comando vence o DJANGO_SETTINGS_MODULE do .env (dev).
# `--ignore=worktrees`: as worktrees locais (ver AGENTS.md) não entram na coleta. Não use
# `norecursedirs`: ele substitui a lista padrão do pytest.
addopts = "--ds=config.settings.test --ignore=worktrees --ignore=mutants"
python_files = ["test_*.py"]

[tool.mutmut]
# Teste de mutação (ver AGENTS.md). Rode sempre por `scripts/mutation`, que limita o paralelismo:
# `--max-children` não é chave deste arquivo e, sem ele, o mutmut abre um filho por núcleo.
# Tudo o que está em `source_paths` é mutado, menos as exclusões abaixo: um arquivo novo entra por
# padrão, e tirá-lo exige um motivo de uma das categorias (critério no AGENTS.md).
source_paths = ["accounts", "assistant", "config", "core", "goals", "transactions"]
do_not_mutate = [
    # Não é código de produção.
    "*/tests/*",
    "*/migrations/*",
    # Declaração, sem lógica.
    "*/admin.py",
    "*/apps.py",
    "*/urls.py",
    # Fora de função (o mutmut não alcança) e com testes diretos: settings, WSGI/ASGI.
    "config/*",
    # Apresentação: o erro aparece na tela.
    "accounts/templatetags/*",
    "core/templatetags/icon_tags.py",
    "core/templatetags/notice_tags.py",
    "transactions/templatetags/*",
    # Ferramenta de desenvolvimento.
    "core/management/*",
]
# A mensagem de log não é comportamento: mutá-la só gera sobrevivente sem sinal.
do_not_mutate_patterns = ['logger\.\w+']
# Linha que nenhum teste executa sempre sobrevive: só custaria tempo.
mutate_only_covered_lines = true
# O que os testes leem do disco além dos pacotes. O `manage.py` é obrigatório: sem ele, o
# pytest-django acha o da raiz e põe a raiz no `sys.path`, e os testes importam o código original,
# não o mutado (nenhum mutante teria teste).
# O `conftest.py` da raiz dá a cada processo o seu banco de teste.
also_copy = ["manage.py", "conftest.py", "templates/", "static/", "frontend/"]

[tool.mutation]
# Piso do score de mutação (`scripts/mutation score`), em %: o medido na rotina noturna do Actions,
# truncado para baixo. Só sobe, como o `fail_under`.
min_score = 86.3

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C90", "S"]

[tool.ruff.lint.per-file-ignores]
# Testes usam `assert` por natureza (S101), senhas de fixture (S105/S106/S107) e leem XML do próprio
# repositório (S314): nada disso é risco de produção. Código fora de testes não tem isenção.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S314"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["config", "core", "accounts", "transactions", "goals", "assistant"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
precision = 2
# Piso = cobertura medida (99,17...%), truncada para baixo, nunca arredondada para cima. Só sobe
# quando a cobertura real sobe.
fail_under = 99.1
